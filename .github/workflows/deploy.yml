name: CI/CD Backend Pipeline (Self-Hosted)

on:
  push:
    branches: [ main, 'feat/**', develop ]
    paths:
      - 'oze-clinic-be/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'oze-clinic-be/**'
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. CI Stage: Validate & Build Check
  # ========================================================
  ci-check:
    name: Build & Validate Solution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oze-clinic-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OZE.sln

      - name: Build solution (Release mode)
        run: dotnet build OZE.sln --configuration Release --no-restore

  # ========================================================
  # 2. CD Stage: Deploy to Self-Hosted Runner (Windows)
  # ========================================================
  deploy:
    name: Deploy to Self-Hosted Server
    needs: ci-check
    runs-on: self-hosted
    defaults:
      run:
        working-directory: oze-clinic-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tự động tạo file .env CỤC BỘ trên máy runner từ GitHub Secrets (KHÔNG đẩy lên Git)
      - name: Configure .env file from GitHub Secrets
        shell: powershell
        env:
          HOST_PORT: ${{ secrets.HOST_PORT || '5000' }}
          ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT || 'Production' }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'OZEApp' }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE || 'OZEApi' }}
          JWT_EXPIRES_IN_MINUTES: ${{ secrets.JWT_EXPIRES_IN_MINUTES || '60' }}
          SENDGRID_KEY: ${{ secrets.SENDGRID_KEY || '' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || 'support@oze.com' }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'OZE Support' }}
        run: |
          Write-Host "Creating local .env file from secrets..."
          $lines = @(
            "HOST_PORT=$($env:HOST_PORT)",
            "ASPNETCORE_ENVIRONMENT=$($env:ASPNETCORE_ENVIRONMENT)",
            "CONNECTION_STRING=$($env:CONNECTION_STRING)",
            "JWT_KEY=$($env:JWT_KEY)",
            "JWT_ISSUER=$($env:JWT_ISSUER)",
            "JWT_AUDIENCE=$($env:JWT_AUDIENCE)",
            "JWT_EXPIRES_IN_MINUTES=$($env:JWT_EXPIRES_IN_MINUTES)",
            "SENDGRID_KEY=$($env:SENDGRID_KEY)",
            "SENDER_EMAIL=$($env:SENDER_EMAIL)",
            "SENDER_NAME=$($env:SENDER_NAME)"
          )
          $lines | Set-Content -Path .env -Encoding UTF8
          Write-Host "Local .env file created successfully."

      - name: Deploy application using Docker Compose
        shell: powershell
        run: |
          Write-Host "Building and starting containers..."
          docker compose down --remove-orphans
          docker compose up -d --build

      - name: Cleanup unused Docker images
        shell: powershell
        run: |
          Write-Host "Pruning dangling Docker images..."
          docker image prune -f

      - name: Verify deployment status
        shell: powershell
        run: |
          Write-Host "Checking container status:"
          docker compose ps
