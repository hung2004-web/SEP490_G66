services:
  oze-api:
    container_name: oze-clinic-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER:-OZEApp}
      - JwtSettings__Audience=${JWT_AUDIENCE:-OZEApi}
      - JwtSettings__ExpiresInMinutes=${JWT_EXPIRES_IN_MINUTES:-60}
      - AuthMessageSenderOptions__SendGridKey=${SENDGRID_KEY:-}
      - AuthMessageSenderOptions__SenderEmail=${SENDER_EMAIL:-support@oze.com}
      - AuthMessageSenderOptions__SenderName=${SENDER_NAME:-OZE Support}
